<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A special birthday message for Adham."
    >

    <title>رسالة إلى أدهم ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="message-page">

    <div class="page-loader" id="pageLoader">
    <div class="loader-content">
        <div class="loader-symbol">✦</div>
        <p>A SPECIAL STORY FOR</p>
        <h2>ADHAM</h2>
        <span></span>
    </div>
</div>

    <!-- Background -->
    <div class="message-bg" aria-hidden="true"></div>

    <div class="glow glow-1" aria-hidden="true"></div>
    <div class="glow glow-2" aria-hidden="true"></div>

    <main class="message-container">

        <p class="message-label" dir="ltr">
            A FEW WORDS FOR YOU
        </p>

        <h1 class="message-title" dir="ltr">
            To Adham,
        </h1>

        <div class="message-line" aria-hidden="true"></div>

        <article class="letter">

            <div
                class="typing-text"
                id="typingText"
                aria-live="polite"
            ></div>

            <span
                class="cursor"
                aria-hidden="true"
            ></span>

            <p
                class="signature"
                id="signature"
            >
                — زياد ❤️
            </p>

        </article>

        <button
            type="button"
            class="continue-btn"
            aria-label="Continue to the memories"
        >
            <span dir="ltr">LET'S SEE THE MEMORIES</span>
            <strong aria-hidden="true">←</strong>
        </button>

    </main>

    <script src="script.js"></script>

</body>

</html>
